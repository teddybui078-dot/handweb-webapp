<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>handweb</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1d1d1f;        /* Apple near-black */
        --ink-soft: #6e6e73;   /* Apple gray */
        --hairline: rgba(0, 0, 0, 0.1);
        --surface: rgba(255, 255, 255, 0.72);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* Camera feed, mirrored. Hidden behind the opaque dashboard until a mode starts. */
      #camera {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1);
        background: #000;
      }
      /* Transparent WebGL canvas for Orb / Web particle modes. */
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

      /* ---------- Dashboard ---------- */
      #dashboard {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 2.5rem; text-align: center; padding: 2rem;
        background: var(--bg);
        transition: opacity 0.5s ease;
      }
      #dashboard.hidden { opacity: 0; pointer-events: none; }
      #dashboard h1 {
        font-size: clamp(2.4rem, 6vw, 3.8rem);
        font-weight: 600; letter-spacing: -0.03em; color: var(--ink);
      }
      #dashboard .sub {
        max-width: 30rem; line-height: 1.5; font-size: 1.05rem;
        color: var(--ink-soft); margin-top: -1.5rem;
      }

      .cards { display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; }
      .card {
        width: 14.5rem; max-width: 80vw;
        padding: 1.75rem 1.5rem; text-align: left;
        background: #fff;
        border: 1px solid var(--hairline);
        border-radius: 1.25rem; cursor: pointer;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
      }
      .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1); }
      .card:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .card .glyph { width: 30px; height: 30px; margin-bottom: 1rem; color: var(--ink); }
      .card .glyph svg { width: 100%; height: 100%; display: block; }
      .card h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.35rem; letter-spacing: -0.01em; }
      .card p { font-size: 0.88rem; line-height: 1.45; color: var(--ink-soft); }
      #error { color: #c0392b; font-size: 0.9rem; min-height: 1.2rem; }

      /* ---------- In-experience chrome ---------- */
      .pill {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 999px;
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        color: var(--ink);
      }
      #back {
        position: fixed; top: 1.1rem; left: 1.1rem; z-index: 8;
        display: none; align-items: center; gap: 0.35rem;
        padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 500;
        cursor: pointer; transition: transform 0.15s ease;
      }
      #back:hover { transform: translateX(-2px); }
      #back.show { display: flex; }

      #nohands {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
        display: none; flex-direction: column; align-items: center; gap: 0.4rem;
        padding: 1rem 1.6rem; text-align: center; border-radius: 1rem;
      }
      #nohands.show { display: flex; }
      #nohands b { font-size: 1rem; font-weight: 600; }
      #nohands span { font-size: 0.85rem; color: var(--ink-soft); }

      #hints {
        position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%); z-index: 5;
        display: none; gap: 1.4rem; padding: 0.6rem 1.2rem; font-size: 0.82rem;
      }
      #hints.show { display: flex; }
      #hints span { color: var(--ink-soft); white-space: nowrap; }
      #hints b { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="scene"></canvas>

    <!-- Landing dashboard -->
    <div id="dashboard">
      <h1>handweb</h1>
      <p class="sub">Control light with your hands. Choose an experience.</p>
      <div class="cards">
        <div class="card" id="card-orb" role="button" tabindex="0">
          <div class="glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <circle cx="12" cy="12" r="9" />
              <ellipse cx="12" cy="12" rx="9" ry="3.4" />
              <line x1="12" y1="3" x2="12" y2="21" />
            </svg>
          </div>
          <h2>Orb</h2>
          <p>A constellation sphere you grow, shrink, and shatter with a flick.</p>
        </div>
        <div class="card" id="card-web" role="button" tabindex="0">
          <div class="glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <path d="M3 6 L12 3 L21 6 L21 18 L12 21 L3 18 Z" />
              <line x1="3" y1="6" x2="21" y2="18" /><line x1="21" y1="6" x2="3" y2="18" />
              <line x1="12" y1="3" x2="12" y2="21" /><line x1="3" y1="12" x2="21" y2="12" />
            </svg>
          </div>
          <h2>Web</h2>
          <p>A living net strung between your two hands that stretches as you move.</p>
        </div>
      </div>
      <div id="error"></div>
    </div>

    <!-- In-experience chrome -->
    <button id="back" class="pill">‹ Back</button>

    <div id="nohands" class="pill">
      <b>No hands detected</b>
      <span>Show both hands to the camera</span>
    </div>

    <div id="hints" class="pill"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
